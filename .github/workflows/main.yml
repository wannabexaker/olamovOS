name: Tests

on:
  push:
    branches: [main]

jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Dependencies
        run: yarn
      - name: Run Jest Unit Tests
        run: yarn test
      - name: Build App
        run: yarn build
      - name: Run Oxlint
        run: yarn lint
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps
      - name: Run Playwright E2E Tests
        run: yarn e2e
      # Only on failure: a passing run's report is never opened, and uploading
      # one on every run is what fills the Actions storage quota.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
